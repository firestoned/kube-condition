name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write  # For keyless signing with Cosign

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  extract-version:
    name: Extract Version from Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag-name }}
    steps:
      - name: Extract version information
        id: version
        uses: firestoned/github-actions/versioning/extract-version@v1.3.0
        with:
          repository: ${{ github.repository }}
          workflow-type: release
          release-tag: ${{ github.event.release.tag_name }}

  package-derive:
    name: Package kube-condition-derive
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update workspace version in Cargo.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ needs.extract-version.outputs.version }}"/' Cargo.toml
          echo "Updated workspace Cargo.toml to version ${{ needs.extract-version.outputs.version }}"
          grep '^version = ' Cargo.toml

      - name: Setup Rust toolchain
        uses: firestoned/github-actions/rust/setup-rust-build@v1.3.0
        with:
          target: x86_64-unknown-linux-gnu

      - name: Package kube-condition-derive
        uses: firestoned/github-actions/rust/package-crate@v1.3.0
        with:
          package: kube-condition-derive
          workspace: true
          allow-dirty: true
          cargo-args: '--no-verify'

      - name: Generate SBOM for kube-condition-derive
        uses: firestoned/github-actions/rust/generate-sbom@v1.3.0
        with:
          format: json
          describe: crate
          workspace: true

      - name: Upload package and SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-condition-derive-package
          path: |
            target/package/kube-condition-derive-*.crate
            **/*.cdx.json

  sign-derive:
    name: Sign kube-condition-derive Package and SBOM
    runs-on: ubuntu-latest
    needs: [extract-version, package-derive]
    permissions:
      id-token: write  # For keyless signing with Cosign
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: kube-condition-derive-package
          path: ./artifacts/kube-condition-derive

      - name: Sign crate package with Cosign
        uses: firestoned/github-actions/security/cosign-sign@v1.3.0
        with:
          artifact-path: ./artifacts/kube-condition-derive/kube-condition-derive-${{ needs.extract-version.outputs.version }}.crate

      - name: Sign SBOM with Cosign
        uses: firestoned/github-actions/security/cosign-sign@v1.3.0
        with:
          artifact-path: ./artifacts/kube-condition-derive/kube-condition-derive.cdx.json

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-condition-derive-signed
          path: |
            ./artifacts/kube-condition-derive/*.crate
            ./artifacts/kube-condition-derive/*.crate.bundle
            ./artifacts/kube-condition-derive/*.cdx.json
            ./artifacts/kube-condition-derive/*.cdx.json.bundle

  publish-derive:
    name: Publish kube-condition-derive to crates.io
    runs-on: ubuntu-latest
    needs: [extract-version, sign-derive]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update workspace version in Cargo.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ needs.extract-version.outputs.version }}"/' Cargo.toml
          echo "Updated workspace Cargo.toml to version ${{ needs.extract-version.outputs.version }}"
          grep '^version = ' Cargo.toml

      - name: Setup Rust toolchain
        uses: firestoned/github-actions/rust/setup-rust-build@v1.3.0
        with:
          target: x86_64-unknown-linux-gnu

      - name: Publish kube-condition-derive to crates.io
        uses: firestoned/github-actions/rust/publish-crate@v1.3.0
        with:
          package: kube-condition-derive
          workspace: true
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          allow-dirty: true

      - name: Wait for crate to be available on crates.io
        run: |
          echo "Waiting 60 seconds for kube-condition-derive to be indexed on crates.io..."
          sleep 60

  package-main:
    name: Package kube-condition
    runs-on: ubuntu-latest
    needs: [extract-version, publish-derive]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update workspace version in Cargo.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ needs.extract-version.outputs.version }}"/' Cargo.toml
          echo "Updated workspace Cargo.toml to version ${{ needs.extract-version.outputs.version }}"
          grep '^version = ' Cargo.toml

      - name: Update kube-condition-derive dependency version
        run: |
          sed -i 's/kube-condition-derive = { version = "[^"]*"/kube-condition-derive = { version = "${{ needs.extract-version.outputs.version }}"/' kube-condition/Cargo.toml
          echo "Updated kube-condition/Cargo.toml dependency version"
          grep 'kube-condition-derive' kube-condition/Cargo.toml

      - name: Setup Rust toolchain
        uses: firestoned/github-actions/rust/setup-rust-build@v1.3.0
        with:
          target: x86_64-unknown-linux-gnu

      - name: Package kube-condition
        uses: firestoned/github-actions/rust/package-crate@v1.3.0
        with:
          package: kube-condition
          workspace: true
          allow-dirty: true

      - name: Generate SBOM for kube-condition
        uses: firestoned/github-actions/rust/generate-sbom@v1.3.0
        with:
          format: json
          describe: crate
          workspace: true

      - name: Upload package and SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-condition-package
          path: |
            target/package/kube-condition-*.crate
            **/*.cdx.json

  sign-main:
    name: Sign kube-condition Package and SBOM
    runs-on: ubuntu-latest
    needs: [extract-version, package-main]
    permissions:
      id-token: write  # For keyless signing with Cosign
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: kube-condition-package
          path: ./artifacts/kube-condition

      - name: Sign crate package with Cosign
        uses: firestoned/github-actions/security/cosign-sign@v1.3.0
        with:
          artifact-path: ./artifacts/kube-condition/kube-condition-${{ needs.extract-version.outputs.version }}.crate

      - name: Sign SBOM with Cosign
        uses: firestoned/github-actions/security/cosign-sign@v1.3.0
        with:
          artifact-path: ./artifacts/kube-condition/kube-condition.cdx.json

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-condition-signed
          path: |
            ./artifacts/kube-condition/*.crate
            ./artifacts/kube-condition/*.crate.bundle
            ./artifacts/kube-condition/*.cdx.json
            ./artifacts/kube-condition/*.cdx.json.bundle

  publish-main:
    name: Publish kube-condition to crates.io
    runs-on: ubuntu-latest
    needs: [extract-version, sign-main]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update workspace version in Cargo.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ needs.extract-version.outputs.version }}"/' Cargo.toml
          echo "Updated workspace Cargo.toml to version ${{ needs.extract-version.outputs.version }}"
          grep '^version = ' Cargo.toml

      - name: Update kube-condition-derive dependency version
        run: |
          sed -i 's/kube-condition-derive = { version = "[^"]*"/kube-condition-derive = { version = "${{ needs.extract-version.outputs.version }}"/' kube-condition/Cargo.toml
          echo "Updated kube-condition/Cargo.toml dependency version"
          grep 'kube-condition-derive' kube-condition/Cargo.toml

      - name: Setup Rust toolchain
        uses: firestoned/github-actions/rust/setup-rust-build@v1.3.0
        with:
          target: x86_64-unknown-linux-gnu

      - name: Publish kube-condition to crates.io
        uses: firestoned/github-actions/rust/publish-crate@v1.3.0
        with:
          package: kube-condition
          workspace: true
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          allow-dirty: true

  upload-release-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [extract-version, sign-derive, sign-main]
    permissions:
      contents: write
    steps:
      - name: Download all signed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-signed'
          path: ./artifacts

      - name: Organize release artifacts
        run: |
          cd artifacts
          mkdir -p release sboms signatures

          # Organize crate files and signatures
          for dir in *-signed; do
            if [ -d "$dir" ]; then
              crate_name="${dir%-signed}"
              echo "Processing $crate_name..."

              # Copy .crate file
              if compgen -G "$dir/*.crate" > /dev/null; then
                cp "$dir"/*.crate release/
              fi

              # Copy .crate signature bundle
              if compgen -G "$dir/*.crate.bundle" > /dev/null; then
                cp "$dir"/*.crate.bundle signatures/
              fi

              # Copy SBOM
              if compgen -G "$dir/*.cdx.json" > /dev/null; then
                cp "$dir"/*.cdx.json "sboms/${crate_name}-sbom.json"
              fi

              # Copy SBOM signature bundle
              if compgen -G "$dir/*.cdx.json.bundle" > /dev/null; then
                cp "$dir"/*.cdx.json.bundle "signatures/${crate_name}-sbom.json.bundle"
              fi
            fi
          done

          # Generate SHA256 checksums
          cd release
          sha256sum *.crate > checksums.sha256
          cd ../sboms
          sha256sum *.json >> ../release/checksums.sha256
          cd ../signatures
          sha256sum *.bundle >> ../release/checksums.sha256

          echo "Release artifacts prepared:"
          ls -lh ../release/
          ls -lh ../sboms/
          ls -lh ../signatures/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/*.crate
            artifacts/sboms/*.json
            artifacts/signatures/*.bundle
            artifacts/release/checksums.sha256

  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        uses: firestoned/github-actions/rust/security-scan@v1.3.0
        with:
          cargo-audit-version: '0.22.0'
          upload-artifact-name: release-audit-${{ needs.extract-version.outputs.version }}
