[workspace]
members = [
    "kube-condition",
    "kube-condition-derive",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Erick Bourgeois <erick@firestoned.io>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/firestoned/kube-condition"
homepage = "https://github.com/firestoned/kube-condition"
documentation = "https://docs.rs/kube-condition"
keywords = ["kubernetes", "operator", "status", "conditions", "derive"]
categories = ["api-bindings", "development-tools::procedural-macro-helpers"]

[workspace.dependencies]
# Core dependencies for runtime library
kube = { version = "0.96", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Proc macro dependencies
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
darling = "0.20"

# Development dependencies
trybuild = "1.0"
